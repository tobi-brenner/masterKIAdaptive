version: "3.8"

services:
  frontend:
    build: ./fe_eduprompt
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080
      - NEXTAUTH_URL=http://localhost:3000

  backend:
    build: ./eduPrompt
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/mydatabase
      - QUARKUS_DATASOURCE_USERNAME=myuser
      - QUARKUS_DATASOURCE_PASSWORD=mypassword
      - QUARKUS_REDIS_HOSTS=redis://redis:6379

  db:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydatabase
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack:latest
    restart: always
    ports:
      - "6379:6379"
  # redis:
  #   image: redis:7
  #   restart: always
  #   ports:
  #     - "6379:6379"

volumes:
  postgres-data: